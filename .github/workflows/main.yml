
name: Build HSONScanner iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HSONScanner
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 \
            https://github.com/theos/sdks.git /tmp/theos-sdks

          mkdir -p "$HOME/theos/sdks"

          python3 - <<'PY'
          import os, glob, re, shutil

          paths = glob.glob(
              "/tmp/theos-sdks/**/iPhoneOS*.sdk",
              recursive=True
          )
          paths = [p for p in paths if os.path.isdir(p)]

          if not paths:
              raise SystemExit("No iPhoneOS SDK found")

          def ver(p):
              m = re.search(
                  r'iPhoneOS([0-9.]+)\.sdk',
                  os.path.basename(p)
              )
              return tuple(map(int, m.group(1).split(".")))

          sdk = max(paths, key=ver)
          name = os.path.basename(sdk)
          version = ".".join(map(str, ver(sdk)))

          shutil.copytree(
              sdk,
              os.path.join(os.path.expanduser("~/theos/sdks"), name),
              dirs_exist_ok=True
          )

          print("Using SDK:", name)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SDKVERSION=" + version + "\n")
          PY

      - name: Create package metadata
        run: |
          cat > HSONScanner.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.frontierdesign.videostar</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

          cat > control <<'EOF'
          Package: com.hson.scanner
          Name: HSONScanner
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Runtime metadata diagnostic scanner
          Maintainer: HSON
          Author: HSON
          Section: Tweaks
          Depends: mobilesubstrate
          EOF

          plutil -lint HSONScanner.plist
          test -s control

      - name: Check project
        run: |
          set -e
          test -f Makefile
          test -f HSONScanner.m
          test -f HSONScanner.plist
          test -f control

      - name: Build HSONScanner
        run: |
          set -e
          make clean
          make package \
            SDKVERSION="$SDKVERSION" \
            FINALPACKAGE=1

      - name: Extract and verify
        run: |
          set -e
          mkdir -p output/extracted

          DEB=$(find packages -type f \
            -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "No DEB package generated"
            exit 1
          fi

          cp "$DEB" output/
          dpkg-deb -x "$DEB" output/extracted

          find output/extracted -type f \
            -name "*.dylib" -exec cp {} output/ \;

          find output -type f -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HSONScanner-iOS
          path: output/
          if-no-files-found: error
          retention-days: 7
