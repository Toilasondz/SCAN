
name: Build HSONScanner iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HSONScanner
    runs-on: macos-15

    steps:
      # 1. Download source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          brew update
          brew install dpkg

      # 3. Install Theos
      - name: Install Theos
        run: |
          git clone --depth 1 --recursive \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      # 4. Download iOS SDK
      - name: Install iOS SDK
        run: |
          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          mkdir -p "$THEOS/sdks"

          python3 - <<'PY'
          import os
          import glob
          import re
          import shutil

          root = "/tmp/theos-sdks"
          destination = os.path.expanduser("~/theos/sdks")

          paths = glob.glob(root + "/**/iPhoneOS*.sdk",
                            recursive=True)

          paths = [p for p in paths if os.path.isdir(p)]

          if not paths:
              raise SystemExit("ERROR: No iPhoneOS SDK found")

          def version(path):
              name = os.path.basename(path)
              match = re.search(r'iPhoneOS([0-9.]+)\.sdk', name)
              return tuple(map(int, match.group(1).split("."))) if match else (0,)

          sdk = max(paths, key=version)
          name = os.path.basename(sdk)

          shutil.copytree(
              sdk,
              os.path.join(destination, name),
              dirs_exist_ok=True
          )

          sdk_version = ".".join(map(str, version(sdk)))

          print("Selected SDK:", name)
          print("SDK version:", sdk_version)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SDKVERSION=" + sdk_version + "\n")
          PY

      # 5. Check source files
      - name: Check project
        run: |
          echo "Checking HSONScanner source..."

          test -f Makefile || {
            echo "ERROR: Makefile missing"
            exit 1
          }

          test -f HSONScanner.m || {
            echo "ERROR: HSONScanner.m missing"
            exit 1
          }

          echo "Source files OK"

      # 6. Build
      - name: Build HSONScanner
        run: |
          echo "Theos: $THEOS"
          echo "SDK: $SDKVERSION"

          make clean || true

          make package \
            SDKVERSION="$SDKVERSION" \
            FINALPACKAGE=1

      # 7. Collect output
      - name: Collect build files
        run: |
          set -e

          mkdir -p output/extracted

          echo "Searching for packages..."

          DEBS=$(find packages -type f -name "*.deb" 2>/dev/null || true)

          if [ -z "$DEBS" ]; then
            echo "ERROR: No .deb package generated"
            find .theos -type f -name "*.dylib" || true
            exit 1
          fi

          for DEB in $DEBS; do
            echo "Found: $DEB"

            cp "$DEB" output/

            dpkg-deb -x "$DEB" output/extracted
          done

          find output/extracted -type f -name "*.dylib" \
            -exec cp {} output/ \;

          echo "Build output:"
          find output -type f

      # 8. Upload artifacts
      - name: Upload HSONScanner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HSONScanner-iOS
          path: output/
          if-no-files-found: error
          retention-days: 7
