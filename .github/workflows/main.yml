
name: Build HSONScanner

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HSONScanner iOS
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS.sdk "$HOME/theos/sdks/"

      - name: Check project files
        run: |
          test -f Makefile
          test -f HSONScanner.m
          echo "Source files found"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          mkdir -p output
          find packages -type f \( -name "*.deb" -o -name "*.dylib" \) -exec cp {} output/ \; 2>/dev/null || true
          find .theos -type f -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          ls -lah output

      - name: Upload HSONScanner
        uses: actions/upload-artifact@v4
        with:
          name: HSONScanner-iOS-build
          path: output/*
          if-no-files-found: error
          retention-days: 7
